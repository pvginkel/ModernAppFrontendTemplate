_subdirectory: template

_envops:
  trim_blocks: true
  lstrip_blocks: true

# ── Template variables ────────────────────────────────────────────────

project_name:
  type: str
  help: "Package name (kebab-case), used in package.json and consts.ts"

project_title:
  type: str
  help: "Short display title (e.g. 'Electronics'), shown in TopBar via consts.ts"

project_description:
  type: str
  default: "A React frontend application"
  help: "Full description for package.json and HTML title"

author_name:
  type: str
  help: "Author name for package.json"

author_email:
  type: str
  help: "Author email for package.json"

backend_port:
  type: int
  default: 5000
  help: "Backend API port (Vite proxy target for /api)"

sse_gateway_port:
  type: int
  default: 3001
  help: "SSE Gateway port (Vite proxy target for /api/sse)"

frontend_port:
  type: int
  default: 3000
  help: "Vite dev server port"

use_oidc:
  type: bool
  default: false
  help: "Include OIDC authentication (auth context, auth gate, user dropdown, 401 handling)"

use_sse:
  type: bool
  default: false
  help: "Include SSE context, SharedWorker, version tracking, deployment bar, task event hooks"

use_app_shell:
  type: bool
  default: true
  help: "Include the standard app shell (top bar, sidebar navigation). Disable for embedded/minimal apps that provide their own layout."

# ── Files generated once, never overwritten ───────────────────────────

_skip_if_exists:
  # App identity
  - "src/lib/consts.ts"
  - "src/components/layout/sidebar-nav.ts"
  - "package.json"
  - ".env.example"
  - "public/favicon.png"
  - ".dockerignore"
  # App-owned styling (theme + variant configs)
  - "src/styles/app-theme.css"
  - "src/styles/button.ts"
  - "src/styles/alert.ts"
  - "src/styles/card.ts"
  - "src/styles/toast.ts"
  - "src/styles/input.ts"
  - "src/styles/notification.ts"
  - "src/styles/progress-bar.ts"
  - "src/styles/index.ts"
  # App-owned UI re-exports (apps add their own components here)
  - "src/components/ui/index.ts"
  # App-owned home route (a placeholder the app replaces)
  - "src/routes/index.tsx"
  # App-owned Vite proxy extensions
  - "vite-proxy-extensions.ts"
  # App-owned test extensions
  - "tests/support/fixtures.ts"
  - "tests/support/selectors-domain.ts"
  # App-owned lint rules, spread after the template's in eslint.config.js
  - "eslint.app.config.js"
  # The same files again under frontend/, where every app keeps this template.
  # In a monorepo, `copier update` (9.11.3) applies its diff with `git apply
  # --exclude <entry>` at the git toplevel, where the paths carry the frontend/
  # prefix: the entries above never match there, and the update merges the
  # template's changes into every app-owned file the app has edited (MAT-16).
  # These twins match. The entries above still do the rest: skip the existing
  # file when the template renders. Keep the two lists in step.
  - "frontend/src/lib/consts.ts"
  - "frontend/src/components/layout/sidebar-nav.ts"
  - "frontend/package.json"
  - "frontend/.env.example"
  - "frontend/public/favicon.png"
  - "frontend/.dockerignore"
  - "frontend/src/styles/app-theme.css"
  - "frontend/src/styles/button.ts"
  - "frontend/src/styles/alert.ts"
  - "frontend/src/styles/card.ts"
  - "frontend/src/styles/toast.ts"
  - "frontend/src/styles/input.ts"
  - "frontend/src/styles/notification.ts"
  - "frontend/src/styles/progress-bar.ts"
  - "frontend/src/styles/index.ts"
  - "frontend/src/components/ui/index.ts"
  - "frontend/src/routes/index.tsx"
  - "frontend/vite-proxy-extensions.ts"
  - "frontend/tests/support/fixtures.ts"
  - "frontend/tests/support/selectors-domain.ts"
  - "frontend/eslint.app.config.js"

# ── Feature-flagged file exclusion ────────────────────────────────────

_exclude:
  # OIDC
  - "{% if not use_oidc %}src/contexts/auth-context.tsx{% endif %}"
  - "{% if not use_oidc %}src/providers/auth-providers.tsx{% endif %}"
  - "{% if not use_oidc %}src/hooks/use-auth.ts{% endif %}"
  - "{% if not use_oidc %}src/components/auth{% endif %}"
  - "{% if not use_oidc %}src/components/layout/user-dropdown.tsx{% endif %}"

  # App shell (sidebar + top bar)
  - "{% if not use_app_shell %}src/components/layout/sidebar.tsx{% endif %}"
  - "{% if not use_app_shell %}src/components/layout/sidebar-nav.ts{% endif %}"
  - "{% if not use_app_shell %}src/components/layout/top-bar.tsx{% endif %}"
  - "{% if not use_app_shell %}src/components/layout/stage-indicator.tsx{% endif %}"
  - "{% if not use_app_shell %}tests/infrastructure/auth/auth-shell.spec.ts{% endif %}"
  - "{% if not use_app_shell %}tests/infrastructure/shell/stage-indicator.spec.ts{% endif %}"

  # SSE
  - "{% if not use_sse %}src/contexts/sse-context.ts{% endif %}"
  - "{% if not use_sse %}src/contexts/sse-context-base.ts{% endif %}"
  - "{% if not use_sse %}src/contexts/sse-context-provider.tsx{% endif %}"
  - "{% if not use_sse %}src/contexts/deployment-context.ts{% endif %}"
  - "{% if not use_sse %}src/contexts/deployment-context-base.ts{% endif %}"
  - "{% if not use_sse %}src/contexts/deployment-context-provider.tsx{% endif %}"
  - "{% if not use_sse %}src/providers/sse-providers.tsx{% endif %}"
  - "{% if not use_sse %}src/hooks/use-sse-task.ts{% endif %}"
  - "{% if not use_sse %}src/hooks/use-version-sse.ts{% endif %}"
  - "{% if not use_sse %}src/hooks/use-deployment-notification.ts{% endif %}"
  - "{% if not use_sse %}src/lib/config/sse-request-id.ts{% endif %}"
  - "{% if not use_sse %}src/workers{% endif %}"
  - "{% if not use_sse %}src/components/primitives/deployment-notification-bar.tsx{% endif %}"
  - "{% if not use_sse %}src/components/sse{% endif %}"
  - "{% if not use_sse %}tests/support/helpers/deployment-sse.ts{% endif %}"
  - "{% if not use_sse %}tests/support/helpers/deployment-reset.ts{% endif %}"

